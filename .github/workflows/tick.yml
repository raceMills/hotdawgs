name: Pool clock

on:
  schedule:
    # Every 10 minutes: open the draft, run the pick clock, settle finished weeks, send notifications
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pool-clock
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install push sender
        run: npm install --no-save --no-package-lock web-push@3.6.7
      - name: Tick
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: node scripts/tick.mjs
