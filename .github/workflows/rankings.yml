name: Update world rankings

on:
  schedule:
    # Mondays at 15:00 UTC (9 or 10am Central), after OWGR publishes the new list
    - cron: "17 15 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch rankings
        run: node scripts/update-rankings.mjs

      - name: Save if changed
        run: |
          git add rankings.json
          if git diff --cached --quiet; then
            echo "Rankings unchanged."
            exit 0
          fi
          git config user.name "hotdawgs-bot"
          git config user.email "hotdawgs-bot@users.noreply.github.com"
          git commit -m "Update world rankings"
          git push
